name: validate

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skill frontmatter
        run: node scripts/check_skill.mjs
      - name: Build and validate sample model
        run: node scripts/selftest.mjs
